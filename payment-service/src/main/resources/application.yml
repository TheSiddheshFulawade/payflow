spring:
  application:
    name: payment-service
  # Defaults match deploy/compose.yaml. The password has no default on purpose: demo secrets live in deploy/ only.
  datasource:
    # logServerErrorDetail=false: row values stay out of logs and the dead-letter topic
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment?logServerErrorDetail=false}
    username: ${PAYMENT_DB_USER:payment}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      # lock_timeout: a stuck transaction must not block the listener: the lock wait ends in an error, the reply is retried.
      # idle_in_transaction_session_timeout: a frozen instance must not hold outbox or payment rows until PostgreSQL
      # drops the dead session. Above the relay's normal wait inside its transaction: 10 s in send() for each of the 2
      # command topics, plus 35 s for the acks. A relay cut off all the same rolls back and sends its batch again.
      connection-init-sql: set lock_timeout = '5s'; set idle_in_transaction_session_timeout = '60s'
      # the same as in the default url, and still set when PAYMENT_DB_URL replaces that url
      data-source-properties:
        logServerErrorDetail: "false"
  flyway:
    # V1 (outbox, inbox) comes from messaging; this service's scripts start at V2.
    locations: classpath:db/messaging,classpath:db/migration
  mvc:
    formcontent:
      filter:
        # Boot's form filter reads PUT/PATCH/DELETE bodies; BodyLimitFilter must decide on size before any read
        enabled: false
  servlet:
    multipart:
      # no endpoint takes uploads: multipart is an unsupported type (415), never a parser failure (500)
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # The realm that issues the tokens. Boot reads its keys lazily, on the first token, so the service (and its
          # health check) starts without Keycloak. The audience is payflow.security.audience (default payflow-api).
          issuer-uri: ${PAYFLOW_ISSUER_URI}
          # Where the keys are fetched. Inside a container the issuer URL (localhost) is not the Keycloak host, so
          # compose sets it; the default is Keycloak's key path under the issuer, which keeps local runs one setting.
          # The issuer claim is still checked against issuer-uri.
          jwk-set-uri: ${PAYFLOW_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
  task:
    scheduling:
      pool:
        # one thread each for outbox relay, sweeper and outbox cleaner: the default single thread would let a relay
        # that waits for Kafka (up to 35 s) stop the sweeper, and overdue payments would wait for the broker
        size: 3

server:
  # loopback unless told otherwise; the container sets PAYMENT_BIND=0.0.0.0
  address: ${PAYMENT_BIND:127.0.0.1}
  port: 8081
  http2:
    # BodyLimitFilter relies on HTTP/1.1: a request with neither Content-Length nor Transfer-Encoding has no body
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
